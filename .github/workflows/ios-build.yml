name: Build Shiguang iOS (unsigned)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 90
    steps:
      - name: Checkout upstream iOS source
        uses: actions/checkout@v4
        with:
          repository: ShiGuangSchedule/shiguangschedule
          ref: 351c4cebbbdc52d71f5cd8ec8305f16ddb09ca8d
          path: source
          persist-credentials: false

      - name: Checkout school adapters
        uses: actions/checkout@v4
        with:
          repository: ShiGuangSchedule/shiguang_warehouse
          ref: main
          path: adapters
          persist-credentials: false

      - name: Checkout school index
        uses: actions/checkout@v4
        with:
          repository: ShiGuangSchedule/shiguang_warehouse
          ref: index-pb-release
          path: school-index
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK for shared project configuration
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Prepare offline school resources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, shutil
          root = pathlib.Path('source/shared/assets/offline_repo')
          (root / 'index').mkdir(parents=True, exist_ok=True)
          shutil.copy2('school-index/school_index.pb', root / 'index/school_index.pb')
          shutil.copytree('adapters/resources', root / 'schools/resources', dirs_exist_ok=True)
          assert (root / 'schools/resources/UJS/ujs_zhengfang_v9.0.js').is_file()
          PY
          git -C source rev-parse HEAD
          git -C adapters rev-parse HEAD
          xcodebuild -version

      - name: Build unsigned iPhone archive
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Shiguang.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            archive 2>&1 | tee "$RUNNER_TEMP/shiguang-build.log"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          python3 - <<'PY'
          import os, pathlib, shutil
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          apps = list((temp / 'Shiguang.xcarchive/Products/Applications').glob('*.app'))
          assert len(apps) == 1, 'Expected exactly one built iOS application'
          shutil.copytree(apps[0], temp / 'ipa/Payload' / apps[0].name, symlinks=True)
          PY
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$RUNNER_TEMP/Shiguang-unsigned.ipa" Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Shiguang-unsigned-IPA
          path: ${{ runner.temp }}/Shiguang-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: ${{ runner.temp }}/shiguang-build.log
          if-no-files-found: ignore
          retention-days: 7
